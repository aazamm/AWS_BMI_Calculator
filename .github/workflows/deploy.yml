name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: PHP syntax check
        run: |
          status=0
          for f in $(git ls-files '*.php'); do php -l "$f" || status=1; done
          exit $status

  deploy:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for GitHub OIDC
      contents: read
    env:
      AWS_REGION: eu-central-1
      ECR_REPO: bmi-web
      CLUSTER: bmi-cluster
      WEB_SERVICE: bmi-web
    steps:
      - uses: actions/checkout@v4

      # Auth via GitHub OIDC — no long-lived AWS keys. Trust scoped to this repo.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::359345324847:role/bmi-ci-oidc
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${ECR_REPO}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

      - name: Deploy web service (force new deployment)
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$WEB_SERVICE" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$WEB_SERVICE"
          echo "Web service stable."
